[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["node_modules", "lib"]
auto_detect_solc = true
via_ir = true
optimizer = false
evm_version = "cancun"

[profile.slither]
optimizer = true
optimizer_runs = 200

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=node_modules/@openzeppelin/"
]

[rpc_endpoints]
hoodi = "https://hoodi.infura.io/v3/{INFURA_KEY}"
