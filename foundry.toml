[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["node_modules"]
auto_detect_solc = true
via_ir = true
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"

remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/"
]

[rpc_endpoints]
hoodi = "https://hoodi.infura.io/v3/{INFURA_KEY}"
