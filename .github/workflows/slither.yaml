name: Slither Analysis
on: [push]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci
        env:
          GH_TOKEN: ${{ secrets.github_token }}

      - name: Compile contracts (Hardhat)
        run: npx hardhat compile --force

      - name: Run Slither
        uses: crytic/slither-action@v0.3.2
        id: slither
        env:
          FOUNDRY_PROFILE: slither
        with:
          fail-on: high
          target: contracts
          slither-args: --hardhat-ignore-compile --exclude-dependencies --filter-paths "node_modules|lib|contracts/test|contracts/test/mocks|test" --exclude controlled-delegatecall,incorrect-return
