name: Slither Analysis
on: [push]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci
        env:
          GH_TOKEN: ${{ secrets.github_token }}

      - name: Compile contracts (Hardhat)
        run: npx hardhat compile --force

      - name: Run Slither
        uses: crytic/slither-action@8fd2924af9f2d7cb899dd25deefd2d5d6686f721 # v0.3.2
        id: slither
        with:
          fail-on: high
          target: .
          slither-args: --hardhat-ignore-compile --exclude controlled-delegatecall,incorrect-return --filter-paths "contracts/test/" --exclude-informational --exclude-dependencies