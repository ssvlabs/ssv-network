name: Publish npm package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-node v7 no longer exports a dummy NODE_AUTH_TOKEN: the generated .npmrc keeps the
      # unresolved ${NODE_AUTH_TOKEN} placeholder until the publish step supplies the secret.
      # No dependency cache in the publishing job.
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Canonical toolchain: .nvmrc Node + npm 11.21.0 (see scripts/ci/check-toolchain.sh).
      - name: Pin canonical npm
        run: |
          npm install --global npm@11.21.0
          bash scripts/ci/check-toolchain.sh

      # Reproducible install from package-lock.json (fails on lock drift).
      - name: Install dependencies
        run: npm ci

      # Package-content gate (npm pack --dry-run): must pass before anything is published.
      - name: Check package contents
        run: npm run pack:check

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
