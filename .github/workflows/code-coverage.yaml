name: Solidity code coverage

on: [push]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Solidity code coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      # Canonical toolchain: .nvmrc Node + npm 11.21.0 (Node 22.23.3 bundles npm 10.9.9, which is
      # only a historical parity row). npm 11 default lifecycle-script policy, no overrides.
      - name: Pin canonical npm
        run: |
          npm install --global npm@11.21.0
          bash scripts/ci/check-toolchain.sh

      - run: npm ci
        env:
          GH_TOKEN: ${{ secrets.github_token }}
      - run: npx hardhat test mocha --coverage
        env:
          NO_GAS_ENFORCE: '1'
          COVERAGE: 'true'
